<div id="gallery">
  <p-carousel
    [value]="products"
    [numVisible]="2"
    [numScroll]="2"
    [circular]="true"
    [responsiveOptions]="responsiveOptions"
    autoplayInterval="3000"
  >
    <ng-template pTemplate="item" let-product>
      <div
        class="border border-surface-200 dark:border-surface-700 rounded m-2 p-4 text-center"
      >
        <div class="mb-4">
          <div class="relative mx-auto">
            <img
              src="https://primefaces.org/cdn/primeng/images/demo/product/{{
                product.image
              }}"
              [alt]="product.name"
              class="w-full rounded-border"
            />
          </div>
        </div>
        <div class="mb-4 font-medium">{{ product.name }}</div>

        <button class="btn btn-primary" [routerLink]="['/detail', product.id]">
          Show
        </button>
      </div>
    </ng-template>
  </p-carousel>
</div>
