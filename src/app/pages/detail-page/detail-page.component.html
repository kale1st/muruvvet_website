<div class="container">
  <div
    id="carouselExampleCaptions"
    class="carousel slide rounded shadow-sm"
    data-bs-ride="carousel"
  >
    <div class="carousel-indicators">
      <button
        type="button"
        data-bs-target="#carouselExampleCaptions"
        data-bs-slide-to="0"
        class="active"
        aria-current="true"
        aria-label="Slide 1"
      ></button>
      <button
        type="button"
        data-bs-target="#carouselExampleCaptions"
        data-bs-slide-to="1"
        aria-label="Slide 2"
      ></button>
      <button
        type="button"
        data-bs-target="#carouselExampleCaptions"
        data-bs-slide-to="2"
        aria-label="Slide 3"
      ></button>
    </div>

    <div class="carousel-inner">
      <!-- *ngFor ile postları döngüye sokuyoruz -->
      <div class="carousel-inner">
        @for (image of post?.images; track image; let i = $index) {
        <div class="carousel-item" [ngClass]="{ active: i === 0 }">
          <img [src]="image.url" class="d-block w-100" alt="..." />
        </div>
        }
      </div>

      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#carouselExampleCaptions"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#carouselExampleCaptions"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  </div>
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="bg-white px-1 rounded shadow-sm m-3">
        <h2 class="mb-3 text-center text-primary">{{ post?.title }}</h2>
        <p class="text-muted text-center mb-4">
          <span> {{ post?.date }} </span> | <span> {{ post?.place }}</span>
        </p>

        <blockquote
          class="blockquote my-4 border-start border-3 ps-3 text-secondary"
        >
          {{ post?.quote }}
        </blockquote>

        @for(par of post?.mainText; track trackByFn){
        <p style="text-align: justify" class="p-1">{{ par }}</p>
        }
        <div class="text-end">
          <a href="/#gallery" class="btn btn-outline-primary mb-1"
            >← Diğer Etkinlikler</a
          >
        </div>
      </div>
    </div>
  </div>
</div>
